name: CI and Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to EC2
    needs: ci
    if: github.event_name != 'pull_request'
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Docker
        run: |
          set -euxo pipefail
          export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          if ! command -v docker; then
            echo "::error::docker not found. On EC2 run: sudo apt install -y docker.io && sudo systemctl start docker"
            exit 1
          fi
          docker --version
          if ! docker ps >/dev/null 2>&1; then
            echo "::error::docker exists but this user cannot use it (usually missing docker group + runner restart)"
            echo "On EC2: sudo usermod -aG docker ubuntu && cd /home/ubuntu/actions-runner && sudo ./svc.sh restart"
            id
            ls -la /var/run/docker.sock || true
            exit 1
          fi
          echo "Docker is ready"

      - name: Write production env from GitHub secrets
        env:
          WEBSITE_URL: ${{ secrets.WEBSITE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_SESSION_SECRET: ${{ secrets.ADMIN_SESSION_SECRET }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NEXT_PUBLIC_GOOGLE_TAG_MANAGER_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_TAG_MANAGER_ID }}
          NEXT_PUBLIC_GOOGLE_ANALYTICS: ${{ secrets.NEXT_PUBLIC_GOOGLE_ANALYTICS }}
        run: bash scripts/write-production-env.sh .env.production

      - name: Build, migrate, and restart app
        run: |
          set -euo pipefail
          docker build -t arteria-landing:latest .
          docker rm -f arteria-landing >/dev/null 2>&1 || true
          docker run --rm --env-file .env.production arteria-landing:latest npx prisma migrate deploy
          docker run -d --name arteria-landing --restart unless-stopped \
            --env-file .env.production \
            -p 3000:3000 arteria-landing:latest
          sleep 5
          curl -fsS http://127.0.0.1:3000/ >/dev/null
          echo "Deploy complete — app is listening on port 3000"

      - name: Remove env file from workspace
        if: always()
        run: rm -f .env.production
