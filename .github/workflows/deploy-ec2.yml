name: CI and Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: npm run build

  deploy:
    name: Deploy to EC2
    needs: ci
    if: github.event_name != 'pull_request'
    runs-on: self-hosted
    env:
      NODE_ENV: production
      WEBSITE_URL: ${{ secrets.WEBSITE_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      ADMIN_SESSION_SECRET: ${{ secrets.ADMIN_SESSION_SECRET }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      NEXT_PUBLIC_GOOGLE_TAG_MANAGER_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_TAG_MANAGER_ID }}
      NEXT_PUBLIC_GOOGLE_ANALYTICS: ${{ secrets.NEXT_PUBLIC_GOOGLE_ANALYTICS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Docker
        run: |
          set -euxo pipefail
          export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
          if ! command -v docker; then
            echo "::error::docker not found. On EC2 run: sudo apt install -y docker.io && sudo systemctl start docker"
            exit 1
          fi
          docker --version
          if ! docker ps >/dev/null 2>&1; then
            echo "::error::docker exists but this user cannot use it (usually missing docker group + runner restart)"
            echo "On EC2: sudo usermod -aG docker ubuntu && cd /home/ubuntu/actions-runner && sudo ./svc.sh restart"
            id
            ls -la /var/run/docker.sock || true
            exit 1
          fi
          echo "Docker is ready"

      - name: Validate required secrets
        run: |
          set -euo pipefail
          required=(
            WEBSITE_URL DATABASE_URL ADMIN_PASSWORD ADMIN_SESSION_SECRET
            AWS_REGION AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_S3_BUCKET
            TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID
          )
          for key in "${required[@]}"; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Missing GitHub secret: $key"
              exit 1
            fi
          done
          case "$DATABASE_URL" in
            postgresql://*|postgres://*) echo "DATABASE_URL format OK" ;;
            *)
              echo "::error::DATABASE_URL must start with postgresql:// or postgres://"
              exit 1
              ;;
          esac

      - name: Build, migrate, and restart app
        run: |
          set -euo pipefail
          # Pass runner env into container (-e VAR reads from shell, no file on disk)
          docker_env=(
            -e NODE_ENV
            -e WEBSITE_URL
            -e DATABASE_URL
            -e ADMIN_PASSWORD
            -e ADMIN_SESSION_SECRET
            -e AWS_REGION
            -e AWS_ACCESS_KEY_ID
            -e AWS_SECRET_ACCESS_KEY
            -e AWS_S3_BUCKET
            -e TELEGRAM_BOT_TOKEN
            -e TELEGRAM_CHAT_ID
          )
          if [[ -n "${NEXT_PUBLIC_GOOGLE_TAG_MANAGER_ID:-}" ]]; then
            docker_env+=(-e NEXT_PUBLIC_GOOGLE_TAG_MANAGER_ID)
          fi
          if [[ -n "${NEXT_PUBLIC_GOOGLE_ANALYTICS:-}" ]]; then
            docker_env+=(-e NEXT_PUBLIC_GOOGLE_ANALYTICS)
          fi

          docker build --no-cache \
            --build-arg AWS_S3_BUCKET="$AWS_S3_BUCKET" \
            --build-arg AWS_REGION="$AWS_REGION" \
            -t arteria-landing:latest .
          docker rm -f arteria-landing >/dev/null 2>&1 || true
          docker run --rm "${docker_env[@]}" arteria-landing:latest npx prisma migrate deploy
          docker run -d --name arteria-landing --restart unless-stopped \
            "${docker_env[@]}" \
            -p 3000:3000 arteria-landing:latest
          sleep 5
          curl -fsS http://127.0.0.1:3000/ >/dev/null

          # Public project images must load (direct S3 or /_next/image)
          sample_url="https://${AWS_S3_BUCKET}.s3.${AWS_REGION}.amazonaws.com/projects/smoke-test.jpg"
          encoded_url="$(python3 -c "import urllib.parse; print(urllib.parse.quote('''$sample_url''', safe=''))")"
          img_code="$(curl -s -o /dev/null -w '%{http_code}' \
            "http://127.0.0.1:3000/_next/image?url=${encoded_url}&w=640&q=75" || echo 000)"
          if [[ "$img_code" == "200" ]]; then
            echo "Image optimizer allowlist OK (/_next/image → 200)"
          else
            echo "::warning::/_next/image returned HTTP $img_code for S3 URL (site uses direct S3 img when unoptimized)"
          fi

          echo "Deploy complete — app is listening on port 3000"
